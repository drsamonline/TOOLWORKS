name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: index and documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # no dependencies: the checker is the standard library, like the page
      - name: Check the index against its catalogue
        run: python3 tools_check.py
      - name: The page opens
        run: |
          python3 - <<'PY'
          import re, sys
          html = open("index.html", encoding="utf-8").read()
          assert html.startswith("<!doctype html>"), "not an html page"
          assert html.rstrip().endswith("</html>"), "the page is truncated"
          for tag in ("<html", "<head", "<body", "<script", "</script>", "</body>"):
              assert tag in html, "missing " + tag
          print("index.html is well formed: %d bytes" % len(html))
          PY
